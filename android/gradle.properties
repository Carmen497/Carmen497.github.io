org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Dirección donde está publicada la web de la app (sin https:// ni barra final).
# El APK abre esa web, así que la app se actualiza sola cada vez que se publican cambios.
twaHost=carmen497.github.io
# Ruta dentro de esa web (empieza y acaba en /).
twaPath=/

# Versión del propio APK. Solo hay que subirla si cambia algo del APK (icono, nombre, dirección).
apkVersionCode=1
apkVersionName=1.0
